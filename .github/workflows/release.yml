name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ## FileTypeGuard ${{ steps.get_version.outputs.VERSION }}

            ### Install via Homebrew
            ```bash
            brew tap yibie/tap
            brew install --cask filetypeguard
            ```

            ### Manual Install
            Download the zip below and move FileTypeGuard.app to /Applications.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "⚠️ 请使用本地 release.sh 脚本构建并上传 app"
          echo "./release.sh ${{ steps.get_version.outputs.VERSION }}"
